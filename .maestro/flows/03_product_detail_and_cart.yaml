# ── Maestro E2E: Product Detail → Wishlist → Cart ────────────────────────────
# Covers:
#   Home → tap a featured product → product detail screen
#   → toggle wishlist heart
#   → adjust quantity
#   → "Buy Now" → dismiss alert → navigate to Cart
#
# Run: maestro test .maestro/flows/03_product_detail_and_cart.yaml

appId: com.ofp.store.mobile
---
- launchApp

# ── Home screen ───────────────────────────────────────────────────────────────
- waitForAnimationToEnd
- assertVisible:
    text: 'Furniture Palace'
    optional: true

# Navigate to Shop tab and tap the first product card
- tapOn:
    text: 'Shop'
    optional: true
- waitForAnimationToEnd

- tapOn:
    index: 0
    id: 'product-card'
    optional: true

# ── Product Detail screen ─────────────────────────────────────────────────────
- waitForAnimationToEnd

- assertVisible:
    text: 'Add to Cart'
    optional: true
- assertVisible:
    text: 'Buy Now'
    optional: true

# Toggle wishlist (heart button)
- tapOn:
    accessibilityLabel: 'Add to wishlist'
    optional: true
- waitForAnimationToEnd

# Dismiss the wishlist alert
- tapOn:
    text: 'OK'
    optional: true
- waitForAnimationToEnd

# Increase quantity
- tapOn:
    accessibilityLabel: 'Increase quantity'
    optional: true
- waitForAnimationToEnd

# Decrease quantity back to 1
- tapOn:
    accessibilityLabel: 'Decrease quantity'
    optional: true
- waitForAnimationToEnd

# Add to cart via Buy Now button
- tapOn:
    text: 'Buy Now'
    optional: true
- waitForAnimationToEnd

# Dismiss the "added to cart" alert
- tapOn:
    text: 'OK'
    optional: true
- waitForAnimationToEnd

# ── Navigate to Cart tab ──────────────────────────────────────────────────────
- tapOn:
    text: 'Cart'
    optional: true
- tapOn:
    id: 'cart-tab'
    optional: true

- waitForAnimationToEnd
- assertVisible:
    text: 'Cart'
    optional: true

# Verify item appears in cart and checkout button is present
- assertVisible:
    text: 'Proceed to Payment'
    optional: true
