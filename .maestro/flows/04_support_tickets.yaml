# ── Maestro E2E: Support Tickets Flow ───────────────────────────────────────
# Tests creating a support ticket via the Profile → Support Tickets modal.
# Run with: maestro test .maestro/flows/04_support_tickets.yaml

appId: com.ofp.store.mobile
---
- launchApp

# Navigate to Profile tab
- tapOn:
    text: 'Profile'
    optional: true
- tapOn:
    id: 'profile-tab'
    optional: true

- assertVisible:
    text: 'Profile'

# Open Support Tickets from profile menu
- tapOn:
    text: 'Support Tickets'

# Modal should be open
- assertVisible:
    text: 'Support Tickets'

# Tap "New" to open create form
- tapOn:
    text: 'New'
    optional: true
- tapOn:
    id: 'new-ticket-button'
    optional: true

- assertVisible:
    text: 'New Ticket'

# Fill in the subject
- tapOn:
    text: 'Brief summary of your issue'
    optional: true
- inputText: 'Missing item in delivery'
- hideKeyboard

# Fill in the description
- tapOn:
    text: 'Describe your issue in detail'
    optional: true
- inputText: 'I ordered 3 items but only received 2. Order #98765. Please investigate.'
- hideKeyboard

# Submit
- tapOn:
    text: 'Submit Ticket'

# Should go back to ticket list (form closes on success)
- assertVisible:
    text: 'Support Tickets'

# The new ticket should be in the list
- assertVisible:
    text: 'Missing item in delivery'
    optional: true

# Close modal
- tapOn:
    id: 'close-modal'
    optional: true
- back
